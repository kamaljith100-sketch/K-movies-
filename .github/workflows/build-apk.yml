
name: Build K-movies APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android source
        run: |
          ZIP=$(find . -type f -iname '*.zip' -not -path './.git/*' -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Repository-ൽ ZIP ഫയൽ കണ്ടെത്തിയില്ല."
            exit 1
          fi

          mkdir -p /tmp/kmovies-source
          unzip -q "$ZIP" -d /tmp/kmovies-source

          ROOT=$(find /tmp/kmovies-source -name settings.gradle.kts -print -quit | xargs dirname)

          if [ -z "$ROOT" ] || [ ! -f "$ROOT/app/build.gradle.kts" ]; then
            echo "ERROR: Android project കണ്ടെത്തിയില്ല."
            exit 1
          fi

          echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: K-movies-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
